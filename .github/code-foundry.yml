version: 1
profile: monorepo
languages: typescript
features: validation,release
# Public repository: Advanced Security features (CodeQL, Dependency Review)
# are expected to be available; lanes degrade gracefully where they are not.
codeql: auto
dependency_review: auto
package_manager: bun
codeql_rust_shards: '["all"]'
codeql_rust_threads: 1
codeql_rust_max_parallel: 1
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.0.2
runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
unit_runner: ubuntu-latest
security_runner: ubuntu-latest
codeql_runner: ubuntu-latest
pr_runner: ubuntu-latest
release_runner: ubuntu-latest
toolchain: auto
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: node
npm_publish: false
post_release: false
post_release_workflow:
post_release_mode: auto
opencode_security: true
sync_mode: overlay
custom_workflows: preserve
license: apache-2.0
git_workflow: direct
merge_strategy: squash
release_merge_strategy: rebase
opencode_security_model:
staging_validation_mode: fast
