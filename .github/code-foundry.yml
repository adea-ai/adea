version: 1
profile: monorepo
languages: typescript
features: validation,release
# This is a private repository; do not assume GitHub Advanced Security or
# public-repository Dependency Review support.
codeql: false
dependency_review: false
package_manager: bun
codeql_rust_shards: '["all"]'
codeql_rust_threads: 1
codeql_rust_max_parallel: 1
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v0.38.0
runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
unit_runner: ubuntu-latest
security_runner: ubuntu-latest
codeql_runner: ubuntu-latest
pr_runner: ubuntu-latest
release_runner: ubuntu-latest
toolchain: auto
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: node
npm_publish: false
post_release: false
post_release_workflow:
post_release_mode: auto
opencode_security: false
sync_mode: overlay
custom_workflows: preserve
license: apache-2.0
git_workflow: direct
merge_strategy: squash
release_merge_strategy: rebase
