name: Cloudflare Preview

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize, converted_to_draft]

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Preview / adea-web
    if: github.event.pull_request.draft == false
    uses: 0xPlayerOne/code-foundry/.github/workflows/cloudflare-deploy.yml@v1.28.14
    with:
      mode: preview
      working-directory: apps/web
      install-working-directory: .
      build-script: build:cloudflare
      bun-version: 1.4.0
      environment: Preview - adea-web
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
