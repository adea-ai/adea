name: Desktop shell

# Desktop validation for the Electrobun shell in `apps/desktop`.
#
# The Code Foundry validation lanes lint, type-check, and test the JavaScript
# workspaces, but they do not build the desktop client or run the desktop
# boundary gates. This workflow closes that gap: it builds the client the shell
# serves, type-checks the workspace, lints it, and runs the gates that pin the
# loopback boot, the command registry, the auth callback handling, and the
# single cloud origin.
#
# The job always runs so this check can be required: a path-filtered workflow
# never reports on a pull request that touches none of its paths, which would
# leave such a pull request permanently blocked. Instead the job detects
# whether the desktop workspace changed and skips the expensive steps when it
# did not, so a non-desktop pull request costs seconds and still reports a
# result.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/vite.desktop.config.ts'
      - 'apps/web/src/lib/desktop-*.ts'
      - 'apps/web/src/components/desktop-*.tsx'
      - 'apps/web/src/components/workspace-navigation*.tsx'
      - 'apps/web/src/components/version-dialog.tsx'
      - 'scripts/desktop-*.test.ts'
      - 'scripts/check-desktop-origins.mjs'
      - 'scripts/test-suite-boundary.test.ts'
      - '.github/workflows/desktop-shell.yml'
  pull_request:
    branches: [main]
    # `opened` and `reopened` matter for pull requests that are never draft
    # (the release automation's), which never emit `ready_for_review`.
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions: {}

# Superseded updates cancel the previous run.
concurrency:
  group: desktop-shell-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Desktop shell
    # A draft pull request cannot merge, so it allocates no runner; the check
    # reports when the pull request is ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect desktop changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          if grep -qE '^(apps/desktop/|apps/web/(vite\.desktop\.config\.ts|src/lib/desktop-.*\.ts|src/components/(desktop-.*\.tsx|workspace-navigation.*\.tsx|version-dialog\.tsx))|scripts/(desktop-[a-z-]*\.test\.ts|check-desktop-origins\.mjs|test-suite-boundary\.test\.ts)$|bun\.lock$|\.github/workflows/desktop-shell\.yml$)' <<< "$changed"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "No desktop changes in this pull request; the desktop steps are skipped."
          fi

      - name: Checkout
        if: steps.changes.outputs.desktop == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        if: steps.changes.outputs.desktop == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install dependencies
        if: steps.changes.outputs.desktop == 'true'
        run: bun install --frozen-lockfile

      # The workspace packages ship `dist` (their exports point at it) and the
      # client build reads the staged public assets, so the client is prepared
      # before it is bundled for the shell. The client is the web app's own
      # SPA build; there is no desktop-only client pipeline.
      - name: Build client
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: bun run shell:client:build

      # The shell's own workspace ships the Electrobun types the shell
      # typecheck resolves.
      - name: Install shell dependencies
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop/shell
        run: bun install

      - name: Typecheck
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Lint
        if: steps.changes.outputs.desktop == 'true'
        working-directory: apps/desktop
        run: bun run lint

      - name: Desktop boundary gates
        if: steps.changes.outputs.desktop == 'true'
        run: |
          set -euo pipefail
          bun test \
            scripts/desktop-boot-boundary.test.ts \
            scripts/desktop-ipc-boundary.test.ts \
            scripts/desktop-auth-boundary.test.ts \
            scripts/desktop-origin-boundary.test.ts \
            scripts/test-suite-boundary.test.ts
          node scripts/check-desktop-origins.mjs
