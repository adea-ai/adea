name: Desktop shell

# Rust validation for the Tauri shell.
#
# The Code Foundry validation lanes lint, type-check, test, and scan the
# JavaScript workspaces; their Rust steps only engage for a repository-root
# `Cargo.toml`, which this repository does not have. This workflow closes that
# gap for `apps/desktop/src-tauri` — format, clippy with warnings denied, and the
# crate's own unit tests (boot taxonomy and launch log, IPC contract parity,
# preference migrations, window geometry, capability policies).
#
# The job always runs so this check can be required: a path-filtered workflow
# never reports on a pull request that touches none of its paths, which would
# leave such a pull request permanently blocked. Instead the job detects whether
# the shell changed and skips the expensive steps when it did not, so a
# non-desktop pull request costs seconds and still reports a result.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/**'
      - 'vendor/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/scripts/**'
      - 'apps/desktop/vite.config.ts'
      - '.github/workflows/desktop-shell.yml'
  pull_request:
    branches: [main]
    # `opened` and `reopened` matter for pull requests that are never draft
    # (the release automation's), which never emit `ready_for_review`.
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions: {}

# Superseded updates cancel the previous run.
concurrency:
  group: desktop-shell-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell:
    name: Rust shell
    # A draft pull request cannot merge, so it allocates no runner; the check
    # reports when the pull request is ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect shell changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
          if grep -qE '^(apps/desktop/src-tauri/|vendor/|apps/desktop/package\.json$|apps/desktop/scripts/|apps/desktop/vite\.config\.ts$|\.github/workflows/desktop-shell\.yml$)' <<< "$changed"; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
          else
            echo "shell=false" >> "$GITHUB_OUTPUT"
            echo "No shell changes in this pull request; the Rust steps are skipped."
          fi

      - name: Checkout
        if: steps.changes.outputs.shell == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        if: steps.changes.outputs.shell == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      # `tauri::generate_context!` embeds the frontend bundle at compile time
      # and refuses to build when it is missing, so the client comes first.
      - name: Build bundled client assets
        if: steps.changes.outputs.shell == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --cwd apps/desktop shell:client:build

      - name: Install Tauri system dependencies
        if: steps.changes.outputs.shell == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        if: steps.changes.outputs.shell == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        if: steps.changes.outputs.shell == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Format
        if: steps.changes.outputs.shell == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Lint
        if: steps.changes.outputs.shell == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.changes.outputs.shell == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test
