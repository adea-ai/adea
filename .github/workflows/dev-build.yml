name: Dev build

# The dev update channel's build lane. Installs that opt into "Dev" follow
# main: every push publishes a signed macOS ARM64 build whose version is
# `<desktop app version on main>-dev.<run number>`. It is a pre-release visible
# only to the dev channel and cannot be promoted to stable (the promoter's
# batch selector only matches the plain tag shape).
#
# The lane publishes the release and explicitly dispatches release-assets.yml.
# GitHub does not start a second workflow for a release created with
# GITHUB_TOKEN; the dispatch uses actions:write and the asset lane's tag input.
# Its tag parser accepts the `-dev.N` shape, so dev and stable runs share the
# same build, signing, and verification steps and differ only in version and
# visibility.
#
# Concurrency cancels superseded pushes: after a burst of merges the newest
# commit is the one that ships. This lane gates nothing; a red run here never
# blocks a merge.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  cut-dev-release:
    name: Cut the dev pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release pipeline owns `chore(main): release …` commits; those builds
    # are the daily pre-releases, not dev builds.
    if: >-
      ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    steps:
      - name: Check out the source version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # Prune before the cut, never after: the release this run creates must
      # not exist while the keep-newest-ten window is computed, or the fresh
      # tag can be pruned moments after publication while release-assets is
      # still validating it (the dev channel saw exactly that race).
      - name: Prune old dev releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Keep the newest ten dev builds. Decide the order here from
          # created_at: the releases endpoint serves a just-created release
          # at the END of the response until GitHub re-sorts it, so slicing
          # the raw order selects the newest release instead of the oldest —
          # that is how dev.100 and dev.104 pruned themselves.
          gh api "repos/$repo/releases?per_page=100" --jq '
            [.[]
            | select(.prerelease == true)
            | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))]
            | sort_by(.created_at) | reverse
            | .[10:] | .[].tag_name
          ' | while read -r old; do
            echo "Pruning old dev release $old"
            gh release delete "$old" --repo "$repo" --yes --cleanup-tag
          done

      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # Match the exact source commit the release lane will build. The
          # latest stable can lag a version bump and produce a tag older than
          # the desktop app itself.
          base="$(
            jq -er '
              .version
              | strings
              | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              | select(. != "0.0.0")
            ' apps/desktop/package.json
          )" || {
            echo "The checked-out desktop source has no stable SemVer version." >&2
            exit 1
          }
          tag="v${base}-dev.${RUN_NUMBER}"
          echo "Dev version: ${base}-dev.${RUN_NUMBER} (anchored at desktop source ${base})"

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            notes="$(printf 'Dev build of main @ %s.\n\nInstalls on the dev update channel only; never promoted to stable.' "$SHA")"
            gh release create "$tag" --repo "$repo" \
              --prerelease --target "$SHA" \
              --title "Adea $tag" --notes "$notes"
          fi

          assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')"
          archive="Adea-${tag}-macos-arm64.app.tar.zst"
          if printf '%s\n' "$assets" | grep -Fxq 'latest.json' && \
            printf '%s\n' "$assets" | grep -Fxq "$archive"; then
            echo "Release $tag already has its signed update feed and app archive."
          else
            # Releases made with GITHUB_TOKEN do not emit a release event that
            # starts other workflows. Explicit dispatch also repairs an
            # existing release whose prior asset build never completed.
            gh workflow run release-assets.yml --repo "$repo" --ref main -f tag="$tag"
          fi
