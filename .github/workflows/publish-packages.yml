name: Publish shared packages

# Publishes the moat-free shared packages (@adea-ai/ui, @adea-ai/asset-manifests,
# @adea-ai/audio) to the public npm registry on every main push that touches
# them (plus manual dispatch). The private agent-sim repo consumes these by
# version, so no registry auth is needed anywhere — not locally, not in CI.
#
# Prerequisites (one-time, dashboard):
#   1. Create the `adea` org on npmjs.com.
#   2. Set NPM_TOKEN to an automation token with publish rights on @adea-ai/*.
# Provenance attestation is deferred until hosted runners return (the local
# runner predates OIDC support and fails job setup when id-token is requested).

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "packages/asset-manifests/**"
      - "packages/audio/**"
      - "scripts/publish-packages.mjs"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adea-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build published packages
        # The tarballs must contain dist/ output: the exports map serves
        # dist types and entry points to registry consumers.
        run: bunx turbo run build --filter=@adea-ai/ui --filter=@adea-ai/asset-manifests --filter=@adea-ai/audio

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-packages.mjs
