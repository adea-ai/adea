name: Publish shared packages

# Publishes the moat-free shared packages (@adea-ai/asset-manifests, @adea-ai/audio,
# @adea-ai/spatial-protocol) to the public npm registry on every main push that touches
# them (plus manual dispatch). The private agent-sim repo consumes these by version, so no
# registry auth is needed anywhere — not locally, not in CI.
#
# `@adea-ai/ui` used to be on this list. It is not any more: that name now belongs to the
# `adea-ai/ui` design system, which publishes it from its own repository, and the npm trusted
# publisher for it has been moved off this repo. Leaving `packages/ui` in the list or in the
# `paths` filter below would make this workflow fire on every release of the app-local kit —
# and since the publisher only skips a version when `latest` already matches, a release here
# would move `latest` back onto the older component kit. The removal is therefore in both
# places: `PUBLISH_PACKAGES` in scripts/publish-packages.mjs, and this filter. Dropping only
# one leaves the workflow running for nothing; dropping only the other leaves it able to
# republish the name.
#
# Prerequisites (one-time, dashboard):
#   1. Create the `adea` org on npmjs.com.
#   2. Set NPM_TOKEN to an automation token with publish rights on @adea-ai/*.
# Provenance attestation is deferred until hosted runners return (the local
# runner predates OIDC support and fails job setup when id-token is requested).

on:
  push:
    branches: [main]
    paths:
      - 'packages/asset-manifests/**'
      - 'packages/audio/**'
      - 'packages/spatial-protocol/**'
      - 'scripts/publish-packages.mjs'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adea-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build published packages
        # The tarballs must contain dist/ output: the exports map serves
        # dist types and entry points to registry consumers.
        run: bunx turbo run build --filter=@adea-ai/ui --filter=@adea-ai/asset-manifests --filter=@adea-ai/audio --filter=@adea-ai/spatial-protocol

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-packages.mjs
