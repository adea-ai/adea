name: Publish shared packages

# Publishes the moat-free shared packages (@adea-ai/audio, @adea-ai/spatial) to the
# public npm registry on every main push that touches
# them (plus manual dispatch). The packages are public for consumers; publishing
# authenticates through npm trusted publishing with GitHub Actions OIDC.
#
# `@adea-ai/ui` used to be on this list. It is not any more: that name now belongs to the
# `adea-ai/ui` design system, which publishes it from its own repository, and the npm trusted
# publisher for it has been moved off this repo. Leaving `packages/ui` in the list or in the
# `paths` filter below would make this workflow fire on every release of the app-local kit —
# and since the publisher only skips a version when `latest` already matches, a release here
# would move `latest` back onto the older component kit. The removal is therefore in both
# places: `PUBLISH_PACKAGES` in scripts/publish-packages.mjs, and this filter. Dropping only
# one leaves the workflow running for nothing; dropping only the other leaves it able to
# republish the name.
#
# Both package settings must trust adea-ai/adea and this workflow filename,
# `publish-packages.yml`, with direct publishing enabled. GitHub-hosted runners
# are required; npm generates provenance automatically for successful OIDC publishes.
# The job is main-only because npm's GitHub publisher trust matches the workflow,
# not a branch name.

on:
  push:
    branches: [main]
    paths:
      - 'packages/audio/**'
      - 'packages/spatial/**'
      - 'scripts/publish-packages.mjs'
      - 'scripts/publish-version.mjs'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

concurrency:
  group: adea-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@12.2.0
          test "$(npm --version)" = "12.2.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build published packages
        # The tarballs must contain dist/ output: the exports map serves
        # dist types and entry points to registry consumers.
        #
        # `@adea-ai/ui` is deliberately absent. It is not in `PUBLISH_PACKAGES`
        # and not in the `paths` filter above, so building it here produced a
        # tarball nothing consumed on every run. The removal has to be complete
        # across all three lists; this is the third.
        run: |
          bun run vp run orch:audio:build
          bun run vp run orch:spatial:build

      - name: Publish changed packages
        run: bun scripts/publish-packages.mjs
