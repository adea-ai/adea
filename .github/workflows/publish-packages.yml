name: Publish shared packages

# Publishes the moat-free shared packages (@adea-ai/ui, @adea-ai/asset-manifests,
# @adea-ai/audio) to the public npm registry on every main push that touches
# them (plus manual dispatch). The private agent-sim repo consumes these by
# version, so no registry auth is needed anywhere — not locally, not in CI.
#
# Prerequisites (one-time, dashboard):
#   1. Create the `adea` org on npmjs.com.
#   2. Set NPM_TOKEN to an automation token with publish rights on @adea-ai/*.
# Provenance attestation needs id-token: write (granted below).

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "packages/asset-manifests/**"
      - "packages/audio/**"
      - "scripts/publish-packages.mjs"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: adea-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Mirrors release-assets.yml: hosted minutes are paused, so paid-plan
    # jobs run on the local macOS host; keep the stock runner otherwise.
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && '["self-hosted","agent-hq-release-macos-arm64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install Node
        uses: actions/setup-node@499ecec0ebc8707a26501b6f46bf0a0353e37d6e31b3463d9297291e4 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-packages.mjs
