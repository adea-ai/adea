name: Release assets

# The desktop auto-update lane: this job builds the stable bundle, publishes
# it to the release, and signs `latest.json` (Ed25519, private half in the
# DESKTOP_UPDATE_SIGNING_KEY secret) so installed shells verify and apply
# updates in place (apps/desktop/shell/src/updater.ts). Still TODO(#370):
# Apple code signing and notarization — the build itself stays unsigned.
#
# This lane builds the Electrobun (Bun + CEF) shell in stable/release mode
# (`electrobun build --env=stable`, the same flag the hutch template's `build`
# task maps to). A stable build stages the distributables under
# `apps/desktop/shell/artifacts/`: a macOS disk image (`*-Adea.dmg`), the
# self-contained app archive (`*-Adea.app.tar.zst`, whose payload carries the
# full bundle: the shell binaries, the bundled CEF framework, and the packaged
# single-UI client), and an unsigned `*-update.json` update manifest that this
# lane deliberately does NOT publish (the update channel is the signed
# `latest.json` staged next to the archive). Dev-mode builds (`electrobun
# build` without `--env`) only ever produce `build/dev-*` bundles and never
# release assets.
#
# Only macOS ARM64 ships today. Windows and Linux `electrobun` stable packaging
# has no CI-verified installer story yet and is tracked with the signing work in
# #370; the verify gate below asserts the macOS bundle structure, so those
# platforms stay out of the lane rather than shipping unverified archives.
#
# workflow_dispatch can drive the lane without a tag: pass an existing release
# `tag` to package that release, or leave it empty and set `ref` to build from
# any ref; the artifacts then attach to the workflow run instead of a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.23.2). Leave empty to build from ref without attaching assets.
        required: false
        type: string
      ref:
        description: Git ref to build when no tag is given (defaults to the branch the lane is dispatched from).
        required: false
        type: string

permissions: {}

concurrency:
  group: adea-release-assets-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ (github.event.release.tag_name || inputs.tag) != '' }}
    permissions:
      contents: read
    outputs:
      desktop_release: ${{ steps.parse.outputs.desktop_release }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Parse Release Please tag
        id: parse
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "desktop_release=true"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.parse.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" >/dev/null

  desktop:
    name: Desktop / macOS ARM64
    needs: validate-release
    if: ${{ !cancelled() && (needs.validate-release.outputs.desktop_release == 'true' || needs.validate-release.result == 'skipped') }}
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Pack Agent Sim engine
        # Official builds pack the private Agent Sim engine into the desktop
        # bundle, which is what entitles them to mount the virtual view (see
        # packages/spatial-protocol/src/engine.ts). The pack lives in the
        # agent-sim repo's `export/` directory at the AGENT_SIM_REF variable;
        # AGENT_SIM_DEPLOY_TOKEN needs read access to that private repo.
        # Without both configured, the shell builds manifests-only and the
        # virtual view renders its offline fallback.
        env:
          AGENT_SIM_REF: ${{ vars.AGENT_SIM_REF }}
          AGENT_SIM_TOKEN: ${{ secrets.AGENT_SIM_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$AGENT_SIM_REF" || -z "$AGENT_SIM_TOKEN" ]]; then
            echo 'Agent Sim pack credentials not configured; building manifests-only shell.'
            exit 0
          fi
          git clone --depth 1 --branch "$AGENT_SIM_REF" \
            "https://x-access-token:${AGENT_SIM_TOKEN}@github.com/adea-ai/agent-sim.git" \
            "$RUNNER_TEMP/agent-sim"
          if [[ ! -f "$RUNNER_TEMP/agent-sim/export/engine.json" ]]; then
            echo "agent-sim at ${AGENT_SIM_REF} has no export/engine.json; refusing to ship a sim-less official build." >&2
            exit 1
          fi
          echo "ADEA_AGENT_SIM_DIST=$RUNNER_TEMP/agent-sim/export" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop workspace dependencies
        run: bun run --cwd packages/types build

      - name: Build bundled client
        working-directory: apps/desktop
        run: bun run shell:client:build

      # The shell's own workspace ships the Electrobun types the shell
      # typecheck resolves.
      - name: Install shell dependencies
        working-directory: apps/desktop/shell
        run: bun install

      - name: Typecheck and desktop boundary gates
        run: |
          set -euo pipefail
          (cd apps/desktop && bun run typecheck)
          bun test \
            scripts/desktop-boot-boundary.test.ts \
            scripts/desktop-ipc-boundary.test.ts \
            scripts/desktop-auth-boundary.test.ts \
            scripts/desktop-origin-boundary.test.ts \
            scripts/test-suite-boundary.test.ts
          node scripts/check-desktop-origins.mjs

      # Same sequence `apps/desktop/scripts/shell.mjs` uses, but in
      # stable/release mode so the distributables land in
      # `apps/desktop/shell/artifacts/`. A failure fails the lane: a release
      # without real desktop artifacts must not publish silently (the verify
      # gate below still double-checks the release).
      - name: Build shell bundle (unsigned, stable)
        working-directory: apps/desktop/shell
        run: |
          set -euo pipefail
          bunx --bun electrobun build --env=stable

      - name: Verify stable bundle structure
        working-directory: apps/desktop/shell
        run: |
          set -euo pipefail
          app="build/stable-macos-arm64/Adea.app"
          payload="$(find "$app/Contents/Resources" -maxdepth 1 -name '*.tar.zst' -print -quit)"
          if [[ -z "$payload" ]]; then
            echo "No packed payload inside the stable app bundle." >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$app/Contents/MacOS/$executable"
          listing="$(tar --zstd -tf "$payload")"
          # Herestrings, not pipes: grep -q exits on first match and a large
          # listing can SIGPIPE the writer, which pipefail turns into a spurious
          # step failure. A herestring is a temp file, so grep can read it all.
          grep -qx "Adea.app/Contents/MacOS/$executable" <<<"$listing"
          grep -qx 'Adea.app/Contents/MacOS/bun' <<<"$listing"
          grep -qx 'Adea.app/Contents/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework' <<<"$listing"
          grep -qx 'Adea.app/Contents/Resources/app/client/index.html' <<<"$listing"
          if grep -Eq '\-update\.json$' <<<"$listing"; then
            echo "The bundle payload must not carry an updater manifest (TODO(#370))." >&2
            exit 1
          fi
          echo "Stable bundle verified: shell binary, bundled CEF framework, and packaged client are present (unsigned)."

      - name: Stage desktop artifacts
        id: stage
        working-directory: apps/desktop/shell
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*-Adea.dmg)
          archives=(artifacts/*-Adea.app.tar.zst)
          if (( ${#dmgs[@]} != 1 || ${#archives[@]} != 1 )); then
            echo "Expected exactly one stable dmg and app archive; found ${#dmgs[@]} and ${#archives[@]}." >&2
            ls artifacts/ >&2 || true
            exit 1
          fi
          # Electrobun's own unsigned `*-update.json` still must not ship: the
          # update channel is the signed `latest.json` this lane generates
          # below, not the manifest format bundled inside the build.
          mkdir -p "$RUNNER_TEMP/staged"
          if [[ -n "$RELEASE_TAG" ]]; then
            cp "${dmgs[0]}" "$RUNNER_TEMP/staged/Adea-${RELEASE_TAG}-macos-arm64.dmg"
            cp "${archives[0]}" "$RUNNER_TEMP/staged/Adea-${RELEASE_TAG}-macos-arm64.app.tar.zst"
          else
            cp "${dmgs[0]}" "$RUNNER_TEMP/staged/$(basename "${dmgs[0]}")"
            cp "${archives[0]}" "$RUNNER_TEMP/staged/$(basename "${archives[0]}")"
          fi
          if compgen -G "$RUNNER_TEMP/staged/*-update.json" >/dev/null; then
            echo "An electrobun updater manifest was staged; the update channel is the signed latest.json instead." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            REPO_ROOT="${{ github.workspace }}"
            SIGN_ARGS=(
              --archive "$RUNNER_TEMP/staged/Adea-${RELEASE_TAG}-macos-arm64.app.tar.zst"
              --tag "$RELEASE_TAG"
              --out "$RUNNER_TEMP/staged/latest.json"
            )
            NOTES_FILE="$RUNNER_TEMP/notes/notes.txt"
            mkdir -p "$RUNNER_TEMP/notes"
            if [[ -f "$REPO_ROOT/CHANGELOG.md" ]]; then
              awk '/^## /{if (seen) exit; seen=1} seen{print}' "$REPO_ROOT/CHANGELOG.md" | sed '1d' > "$NOTES_FILE"
              if [[ -s "$NOTES_FILE" ]]; then
                SIGN_ARGS+=(--notes-file "$NOTES_FILE")
              fi
            fi
            bun "$REPO_ROOT/scripts/sign-desktop-update.mjs" "${SIGN_ARGS[@]}"
          fi
          echo "path=$RUNNER_TEMP/staged" >> "$GITHUB_OUTPUT"

      # Tagged runs (release event or an explicit tag input) attach the
      # distributables to the release. A dispatch without a tag has no release
      # to update, so the same files attach to the workflow run instead; the
      # unsigned-with-documentation state is unchanged either way.
      - name: Upload desktop artifacts to release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          STAGED: ${{ steps.stage.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$STAGED"/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload desktop artifacts to workflow run
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-shell-stable-macos-arm64
          path: ${{ steps.stage.outputs.path }}/*
          if-no-files-found: error

  publish-release-notes:
    name: Publish release notes
    needs: [validate-release, desktop]
    if: ${{ (github.event.release.tag_name || inputs.tag) != '' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Publish canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" |
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file -

  verify-assets:
    name: Verify desktop assets
    needs: [validate-release, desktop, publish-release-notes]
    if: ${{ (github.event.release.tag_name || inputs.tag) != '' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Adea-*-macos-arm64.dmg' \
            --pattern 'Adea-*-macos-arm64.app.tar.zst' \
            --dir assets
          shopt -s nullglob
          dmgs=(assets/Adea-*-macos-arm64.dmg)
          archives=(assets/Adea-*-macos-arm64.app.tar.zst)
          if (( ${#dmgs[@]} != 1 || ${#archives[@]} != 1 )); then
            echo "Expected exactly one macOS dmg and one app archive on the release; found ${#dmgs[@]} and ${#archives[@]}." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi

          # The dmg is a UDIF image; its koly trailer sits in the last 512
          # bytes, and a bare CEF bundle never compresses anywhere near this
          # small, so a truncated upload cannot pass.
          dmg_size="$(stat -c %s "${dmgs[0]}")"
          if (( dmg_size < 50 * 1024 * 1024 )); then
            echo "The dmg is only ${dmg_size} bytes; a real bundle is far larger." >&2
            exit 1
          fi
          if ! tail -c 512 "${dmgs[0]}" | head -c 4 | grep -q 'koly'; then
            echo "The dmg has no UDIF koly trailer; it is not a complete disk image." >&2
            exit 1
          fi

          # The app archive payload must carry the full bundle: the shell
          # binaries under Contents/MacOS, the bundled CEF framework, and the
          # packaged single-UI client.
          listing="$(tar --zstd -tf "${archives[0]}")"
          # Herestrings, not pipes: grep -q exits on first match and a large
          # listing can SIGPIPE the writer, which pipefail turns into a spurious
          # step failure. A herestring is a temp file, so grep can read it all.
          grep -qx 'Adea.app/Contents/MacOS/launcher' <<<"$listing"
          grep -qx 'Adea.app/Contents/MacOS/bun' <<<"$listing"
          grep -qx 'Adea.app/Contents/Frameworks/Chromium Embedded Framework.framework/Chromium Embedded Framework' <<<"$listing"
          grep -qx 'Adea.app/Contents/Resources/app/client/index.html' <<<"$listing"
          echo "Release assets verified: unsigned macOS dmg plus self-contained app archive (shell binary, bundled CEF, packaged client)."

      - name: Verify the signed update feed is published
        # The update channel is the signed latest.json; the Electrobun stable
        # build's own unsigned *-update.json must still never ship.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name] | join("\n")')"
          if grep -Eq '.*-update\.json$' <<<"$assets"; then
            echo "An unsigned electrobun updater manifest was published; the update channel is latest.json." >&2
            exit 1
          fi
          if ! grep -qx 'latest\.json' <<<"$assets"; then
            echo "The signed update feed (latest.json) is missing from the release." >&2
            exit 1
          fi
          echo "Signed update feed published alongside the desktop artifacts."
