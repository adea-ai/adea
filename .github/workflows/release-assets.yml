name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.2.0).
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-hq-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate-release:
    name: Validate release
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && '["self-hosted","agent-hq-release-macos-arm64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop_release: ${{ steps.parse.outputs.desktop_release }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Parse Release Please tag
        id: parse
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "desktop_release=true"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.parse.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" >/dev/null

  desktop:
    name: Desktop / ${{ matrix.platform }}
    needs: validate-release
    if: needs.validate-release.outputs.desktop_release == 'true'
    strategy:
      fail-fast: false
      # The local fallback runners share one macOS host (and Rosetta for
      # Linux). Serialize those jobs to avoid exhausting the host process
      # table; hosted runners retain parallel matrix builds.
      max-parallel: ${{ vars.CI_BILLING_PAUSED == 'true' && 1 || 3 }}
      matrix:
        include:
          - runner: macos-14
            self_hosted_runner: '["self-hosted","agent-hq-release-macos-arm64"]'
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
            self_hosted_args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            timeout_minutes: 45
          - runner: ubuntu-24.04
            self_hosted_runner: '["self-hosted","agent-hq-release-linux-x64"]'
            platform: Linux x64
            # Tauri 2.11's in-process RPM bundler can hang indefinitely after
            # rendering the desktop file. Keep RPM out of the release matrix
            # until the upstream rpm-rs update lands; DEB + AppImage provide
            # the Linux install and updater artifacts we publish.
            args: --bundles deb,appimage
            self_hosted_args: --bundles deb,appimage
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 120
          - runner: windows-latest
            self_hosted_runner: '["self-hosted","agent-hq-release-macos-arm64"]'
            platform: Windows x64
            args: ""
            self_hosted_args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
            target: x86_64-pc-windows-msvc
            timeout_minutes: 45
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && matrix.self_hosted_runner || format('"{0}"', matrix.runner)) }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The local Linux runner is an emulated x64 environment. Keep Cargo
      # single-threaded there because Rosetta's process accounting can reject
      # a second rustc even when the desktop matrix is serialized.
      CARGO_BUILD_JOBS: ${{ matrix.platform == 'Linux x64' && '1' || '4' }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Fetch private asset pack
        # Release artifacts must ship real models: without ASSETS_READ_TOKEN
        # this step (and the release) fails fast instead of shipping
        # manifests-only desktop builds. (`secrets` is intentionally not
        # tested in `if:` here — that context is unavailable to step
        # conditionals; an empty secret makes the fetch fail loudly.)
        # All tags carry the fetch script since the pack move; tags without it
        # fall through to the in-repo branch below as a safety net.
        env:
          ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f scripts/fetch-assets.mjs ]; then
            bun scripts/fetch-assets.mjs
          else
            echo 'No fetch script at this tag; using in-repo art.'
          fi

      - name: Load release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release-notes-${RANDOM}-${RANDOM}"
          {
            echo "body<<$delimiter"
            bun scripts/release-notes.mjs "$RELEASE_VERSION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Windows cross-compilation tools
        if: vars.CI_BILLING_PAUSED == 'true' && matrix.platform == 'Windows x64'
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list nsis >/dev/null 2>&1 || brew install nsis
          command -v cargo-xwin >/dev/null 2>&1 || cargo install --locked cargo-xwin@0.23.1
          rustup target add x86_64-pc-windows-msvc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Isolate Windows cross-compilation output
        if: vars.CI_BILLING_PAUSED == 'true' && matrix.platform == 'Windows x64'
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/apps/desktop/src-tauri/target" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop workspace dependencies
        run: bun run --cwd packages/types build

      - name: Build and upload desktop bundle
        id: desktop_bundle
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macOS ARM64' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          tauriScript: bun scripts/tauri.mjs
          args: ${{ vars.CI_BILLING_PAUSED == 'true' && matrix.self_hosted_args || matrix.args }}

      - name: Retry desktop bundle upload
        if: steps.desktop_bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macOS ARM64' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          tauriScript: bun scripts/tauri.mjs
          args: ${{ vars.CI_BILLING_PAUSED == 'true' && matrix.self_hosted_args || matrix.args }}

  publish-release-notes:
    name: Publish release notes
    needs: [validate-release, desktop]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && '["self-hosted","agent-hq-release-macos-arm64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Publish canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" |
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file -

  publish-updater-channel:
    name: Publish desktop updater channel
    needs: [validate-release, desktop, publish-release-notes]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && '["self-hosted","agent-hq-release-macos-arm64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Prepare public signed updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/agent-hq-update-channel"
          channel="https://updates.adea.dev/desktop-updates/"
          mkdir -p "$staging/site/desktop-updates"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$staging"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets' > "$staging/assets.json"
          node scripts/prepare-desktop-update-channel.mjs \
            "$staging/latest.json" \
            "$staging/assets.json" \
            "$channel" \
            "$staging/site/desktop-updates/latest.json" \
            "$staging/update-assets.json"
          jq -e --arg version "$RELEASE_VERSION" '.version == $version' \
            "$staging/site/desktop-updates/latest.json" >/dev/null
          while IFS= read -r asset; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir "$staging/site/desktop-updates"
          done < <(jq -r '.[]' "$staging/update-assets.json")
          test -n "$(find "$staging/site/desktop-updates" -maxdepth 1 -type f ! -name latest.json -print -quit)"

      - name: Install AWS CLI for R2 upload
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          command -v aws >/dev/null || brew install awscli
          command -v aws >/dev/null

      - name: Upload updater channel to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/agent-hq-update-channel/site/desktop-updates"
          endpoint="https://aa2dc82d7e02aff12b77800a8201df3f.r2.cloudflarestorage.com"
          # AWS CLI (not wrangler: wrangler caps single uploads at 300 MiB
          # and bundles exceed that) multipart-uploads each channel file.
          for asset in "$site"/*; do
            name="$(basename "$asset")"
            aws --region auto --endpoint-url "$endpoint" s3 cp "$asset" "s3://agent-hq/desktop-updates/${name}"
          done

      - name: Verify public updater manifest
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/public-latest.json"
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "https://updates.adea.dev/desktop-updates/latest.json" \
            --output "$manifest"
          jq -e --arg version "$RELEASE_VERSION" \
            '. as $manifest |
              .version == $version and
              (["darwin-aarch64", "linux-x86_64", "windows-x86_64"] | all(
                . as $platform |
                ($manifest.platforms[$platform].signature | type == "string" and length > 0) and
                ($manifest.platforms[$platform].url | startswith("https://updates.adea.dev/desktop-updates/"))
              ))' \
            "$manifest" >/dev/null

  verify-assets:
    name: Verify desktop assets
    needs: [validate-release, desktop, publish-release-notes, publish-updater-channel]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' && needs.publish-updater-channel.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_BILLING_PAUSED == 'true' && '["self-hosted","agent-hq-release-macos-arm64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("agent"; "i"))] | length')"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least one Agent HQ desktop asset per target; found $count." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo "Verified $count Agent HQ desktop release asset(s)."
