name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.2.0).
        required: true
        type: string

permissions: {}

concurrency:
  group: adea-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop_release: ${{ steps.parse.outputs.desktop_release }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Parse Release Please tag
        id: parse
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "desktop_release=true"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.parse.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" >/dev/null

  desktop:
    name: Desktop / ${{ matrix.platform }}
    needs: validate-release
    if: needs.validate-release.outputs.desktop_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            timeout_minutes: 45
          - runner: ubuntu-24.04
            platform: Linux x64
            # Tauri 2.11's in-process RPM bundler can hang indefinitely after
            # rendering the desktop file. Keep RPM out of the release matrix
            # until the upstream rpm-rs update lands; DEB + AppImage provide
            # the Linux install and updater artifacts we publish.
            args: --bundles deb,appimage
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 120
          - runner: windows-latest
            platform: Windows x64
            args: ''
            target: x86_64-pc-windows-msvc
            timeout_minutes: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Pack Agent Sim engine
        # Official builds pack the private Agent Sim engine into the desktop
        # bundle, which is what entitles them to mount the virtual view (see
        # packages/spatial-protocol/src/engine.ts). The pack lives in the
        # agent-sim repo's `export/` directory at the AGENT_SIM_REF variable;
        # AGENT_SIM_DEPLOY_TOKEN needs read access to that private repo.
        # Without both configured, the shell builds manifests-only and the
        # virtual view renders its offline fallback.
        env:
          AGENT_SIM_REF: ${{ vars.AGENT_SIM_REF }}
          AGENT_SIM_TOKEN: ${{ secrets.AGENT_SIM_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$AGENT_SIM_REF" || -z "$AGENT_SIM_TOKEN" ]]; then
            echo 'Agent Sim pack credentials not configured; building manifests-only shell.'
            exit 0
          fi
          git clone --depth 1 --branch "$AGENT_SIM_REF" \
            "https://x-access-token:${AGENT_SIM_TOKEN}@github.com/adea-ai/agent-sim.git" \
            "$RUNNER_TEMP/agent-sim"
          if [[ ! -f "$RUNNER_TEMP/agent-sim/export/engine.json" ]]; then
            echo "agent-sim at ${AGENT_SIM_REF} has no export/engine.json; refusing to ship a sim-less official build." >&2
            exit 1
          fi
          echo "ADEA_AGENT_SIM_DIST=$RUNNER_TEMP/agent-sim/export" >> "$GITHUB_ENV"

      - name: Load release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release-notes-${RANDOM}-${RANDOM}"
          {
            echo "body<<$delimiter"
            bun scripts/release-notes.mjs "$RELEASE_VERSION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop workspace dependencies
        run: bun run --cwd packages/types build

      - name: Build and upload desktop bundle
        id: desktop_bundle
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macOS ARM64' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          tauriScript: bun scripts/tauri.mjs
          args: ${{ matrix.args }}

      - name: Retry desktop bundle upload
        if: steps.desktop_bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macOS ARM64' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          tauriScript: bun scripts/tauri.mjs
          args: ${{ matrix.args }}

  publish-release-notes:
    name: Publish release notes
    needs: [validate-release, desktop]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Publish canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" |
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file -

  verify-assets:
    name: Verify desktop assets
    needs: [validate-release, desktop, publish-release-notes]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("adea"; "i"))] | length')"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least one Adea desktop asset per target; found $count." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo "Verified $count Adea desktop release asset(s)."

      - name: Verify updater channel
        # The Tauri updater polls the release's latest.json directly
        # (releases/latest/download/latest.json); tauri-action aggregates the
        # matrix entries into it. Reject the release unless every target is
        # present, signed, and pointing at this repository's assets.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/latest.json"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --output "$manifest"
          jq -e --arg version "$RELEASE_VERSION" \
            '. as $manifest |
              .version == $version and
              (["darwin-aarch64", "linux-x86_64", "windows-x86_64"] | all(
                . as $platform |
                ($manifest.platforms[$platform].signature | type == "string" and length > 0) and
                ($manifest.platforms[$platform].url | test("^https://(api\\.)?github\\.com/repos/adea-ai/adea/releases/"))
              ))' \
            "$manifest" >/dev/null
          echo "Updater channel verified for $RELEASE_VERSION."
