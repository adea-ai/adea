name: Release assets

# TODO(#370): signing, notarization, and the auto-update lane for the Electrobun
# shell are not wired yet; this job builds unsigned.
#
# The previous lane built the Rust shell with platform installers and an update
# manifest. This lane builds the Electrobun (Bun + CEF) shell instead: it
# prepares and builds the bundled client, validates the desktop workspace, then
# attempts the shell bundle from `apps/desktop/shell` the same way
# `apps/desktop/scripts/shell.mjs` does. The engine pack download may not be
# available on a bare runner yet, so the bundle step is allowed to fail;
# `verify-assets` still fails a release that publishes no Adea desktop
# artifacts or claims an unsigned update manifest.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.2.0).
        required: true
        type: string

permissions: {}

concurrency:
  group: adea-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop_release: ${{ steps.parse.outputs.desktop_release }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Parse Release Please tag
        id: parse
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "desktop_release=true"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.parse.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" >/dev/null

  desktop:
    name: Desktop / ${{ matrix.platform }}
    needs: validate-release
    if: needs.validate-release.outputs.desktop_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            target: aarch64-apple-darwin
            timeout_minutes: 45
          - runner: ubuntu-24.04
            platform: Linux x64
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 120
          - runner: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc
            timeout_minutes: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Pack Agent Sim engine
        # Official builds pack the private Agent Sim engine into the desktop
        # bundle, which is what entitles them to mount the virtual view (see
        # packages/spatial-protocol/src/engine.ts). The pack lives in the
        # agent-sim repo's `export/` directory at the AGENT_SIM_REF variable;
        # AGENT_SIM_DEPLOY_TOKEN needs read access to that private repo.
        # Without both configured, the shell builds manifests-only and the
        # virtual view renders its offline fallback.
        env:
          AGENT_SIM_REF: ${{ vars.AGENT_SIM_REF }}
          AGENT_SIM_TOKEN: ${{ secrets.AGENT_SIM_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$AGENT_SIM_REF" || -z "$AGENT_SIM_TOKEN" ]]; then
            echo 'Agent Sim pack credentials not configured; building manifests-only shell.'
            exit 0
          fi
          git clone --depth 1 --branch "$AGENT_SIM_REF" \
            "https://x-access-token:${AGENT_SIM_TOKEN}@github.com/adea-ai/agent-sim.git" \
            "$RUNNER_TEMP/agent-sim"
          if [[ ! -f "$RUNNER_TEMP/agent-sim/export/engine.json" ]]; then
            echo "agent-sim at ${AGENT_SIM_REF} has no export/engine.json; refusing to ship a sim-less official build." >&2
            exit 1
          fi
          echo "ADEA_AGENT_SIM_DIST=$RUNNER_TEMP/agent-sim/export" >> "$GITHUB_ENV"

      - name: Load release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release-notes-${RANDOM}-${RANDOM}"
          {
            echo "body<<$delimiter"
            bun scripts/release-notes.mjs "$RELEASE_VERSION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop workspace dependencies
        run: bun run --cwd packages/types build

      - name: Build bundled client
        working-directory: apps/desktop
        run: bun run shell:client:build

      - name: Typecheck and desktop boundary gates
        run: |
          set -euo pipefail
          (cd apps/desktop && bun run typecheck)
          bun test \
            scripts/desktop-boot-boundary.test.ts \
            scripts/desktop-ipc-boundary.test.ts \
            scripts/desktop-auth-boundary.test.ts \
            scripts/desktop-origin-boundary.test.ts \
            scripts/test-suite-boundary.test.ts
          node scripts/check-desktop-origins.mjs

      # Same sequence `apps/desktop/scripts/shell.mjs` uses: install the shell
      # workspace, then bundle with Electrobun. The engine pack is large, so the
      # step is allowed to fail until #370 wires the supported release path.
      - name: Build shell bundle (unsigned)
        id: desktop_bundle
        continue-on-error: true
        working-directory: apps/desktop/shell
        run: |
          set -euo pipefail
          bun install
          bunx --bun electrobun build

      - name: Retry desktop bundle build
        if: steps.desktop_bundle.outcome == 'failure'
        continue-on-error: true
        working-directory: apps/desktop/shell
        run: |
          set -euo pipefail
          bun install
          bunx --bun electrobun build

      # Upload every artifact Electrobun produced. When the bundle step could
      # not run, the release stays asset-free here; `verify-assets` then fails
      # the release with an explicit message instead of shipping silently.
      - name: Upload desktop artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(apps/desktop/shell/artifacts/*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "::warning::No Electrobun artifacts were produced (TODO(#370): signing and update lane)."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-release-notes:
    name: Publish release notes
    needs: [validate-release, desktop]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Publish canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" |
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file -

  verify-assets:
    name: Verify desktop assets
    needs: [validate-release, desktop, publish-release-notes]
    if: ${{ needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("adea"; "i"))] | length')"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least one Adea desktop artifact per target; found $count." >&2
            echo "The Electrobun shell bundle is unsigned and its signing/update lane is tracked in #370." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo "Verified $count unsigned Adea desktop release artifact(s) (TODO(#370): signing, notarization, auto-update)."

      - name: Verify no updater manifest is published
        # The updater manifest (latest.json) went away with the Rust lane.
        # Reject a release that reintroduces an unsigned update channel before
        # the signing work in #370 lands.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | grep -Fx 'latest.json'; then
            echo "latest.json is present but the Electrobun update lane is not wired (TODO(#370))." >&2
            exit 1
          fi
          echo "No updater manifest published; the release stays unsigned."
