name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.2.0).
        required: true
        type: string

permissions: {}

concurrency:
  group: agent-hq-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate-release:
    name: Validate release
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desktop_release: ${{ steps.parse.outputs.desktop_release }}
      release_version: ${{ steps.parse.outputs.release_version }}
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

      - name: Parse Release Please tag
        id: parse
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi

          {
            echo "desktop_release=true"
            echo "release_version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ steps.parse.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" >/dev/null

  desktop:
    name: Desktop / ${{ matrix.platform }}
    needs: validate-release
    if: vars.CI_BILLING_PAUSED != 'true' && needs.validate-release.outputs.desktop_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: Linux x64
            args: ""
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: Windows x64
            args: ""
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Load release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release-notes-${RANDOM}-${RANDOM}"
          {
            echo "body<<$delimiter"
            node scripts/release-notes.mjs "$RELEASE_VERSION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Align desktop bundle version with release
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          node - "$version" <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const path = 'apps/desktop/src-tauri/tauri.conf.json'
          const config = JSON.parse(readFileSync(path, 'utf8'))
          config.version = process.argv[2]
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          tauriScript: bun scripts/tauri.mjs
          args: ${{ matrix.args }}

  publish-release-notes:
    name: Publish release notes
    needs: [validate-release, desktop]
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Publish canonical notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$RELEASE_VERSION" |
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file -

  publish-updater-channel:
    name: Publish desktop updater channel
    needs: [validate-release, desktop, publish-release-notes]
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare public signed updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/agent-hq-update-channel"
          channel="https://0xplayerone.github.io/agent-hq/desktop-updates/"
          mkdir -p "$staging/site/desktop-updates"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$staging"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets' > "$staging/assets.json"
          node scripts/prepare-desktop-update-channel.mjs \
            "$staging/latest.json" \
            "$staging/assets.json" \
            "$channel" \
            "$staging/site/desktop-updates/latest.json" \
            "$staging/update-assets.json"
          jq -e --arg version "$RELEASE_VERSION" '.version == $version' \
            "$staging/site/desktop-updates/latest.json" >/dev/null
          while IFS= read -r asset; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir "$staging/site/desktop-updates"
          done < <(jq -r '.[]' "$staging/update-assets.json")
          test -n "$(find "$staging/site/desktop-updates" -maxdepth 1 -type f ! -name latest.json -print -quit)"

      - name: Upload updater channel
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/agent-hq-update-channel/site

      - name: Deploy updater channel
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify public updater manifest
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/public-latest.json"
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "https://0xplayerone.github.io/agent-hq/desktop-updates/latest.json" \
            --output "$manifest"
          jq -e --arg version "$RELEASE_VERSION" \
            '.version == $version and ([.platforms[].url | startswith("https://0xplayerone.github.io/agent-hq/desktop-updates/")] | all)' \
            "$manifest" >/dev/null

  verify-assets:
    name: Verify desktop assets
    needs: [validate-release, desktop, publish-release-notes, publish-updater-channel]
    if: ${{ vars.CI_BILLING_PAUSED != 'true' && needs.validate-release.outputs.desktop_release == 'true' && needs.desktop.result == 'success' && needs.publish-release-notes.result == 'success' && needs.publish-updater-channel.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("agent"; "i"))] | length')"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least one Agent HQ desktop asset per target; found $count." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo "Verified $count Agent HQ desktop release asset(s)."
