name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to package (for example, v0.2.0).
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: agent-hq-release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version such as v0.2.0: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

  desktop:
    name: Desktop / ${{ matrix.platform }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS ARM64
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: Linux x64
            args: ""
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: Windows x64
            args: ""
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Align desktop bundle version with release
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          node - "$version" <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const path = 'apps/desktop/src-tauri/tauri.conf.json'
          const config = JSON.parse(readFileSync(path, 'utf8'))
          config.version = process.argv[2]
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache desktop build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            apps/desktop/src-tauri/target
          key: >-
            ${{ runner.os }}-agent-hq-desktop-${{ matrix.target }}-
            ${{ hashFiles('bun.lock', 'apps/desktop/package.json',
            'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-agent-hq-desktop-${{ matrix.target }}-
            ${{ runner.os }}-agent-hq-desktop-

      - name: Build and upload desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}

  verify-assets:
    name: Verify desktop assets
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify uploaded desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(test("agent"; "i"))] | length')"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least one Agent HQ desktop asset per target; found $count." >&2
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo "Verified $count Agent HQ desktop release asset(s)."
