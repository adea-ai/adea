name: Code Foundry Release

on:
  push:
    branches: [main]
  schedule:
    # Batch Release Please to four windows per day, offset from cortana's
    # windows so the shared automation token's hourly budget never sees both
    # repos' bursts at once. Every push to main used to update the version
    # pull request immediately and the configured automation token merged it
    # on sight, so each merge became its own release with a full
    # release-assets build behind it (~58 asset jobs/day). Scheduled runs let
    # one window's merges accumulate into a single version pull request; a
    # window with nothing unreleased is a cheap no-op.
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      release-while-paused:
        description: Run only the release pipeline while the shared CI billing pause remains active.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One owner for draft staging and npm publication. Never cancel an active release.
concurrency:
  group: code-foundry-qualified-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Release Please consumes no qualification outputs; it runs first so the
    # qualification below only executes when a release (or a stuck draft) needs
    # it. Version pull requests keep flowing even when the candidate is broken;
    # publication stays gated on qualification success in the stage job.
    if: >-
      (vars.CI_BILLING_PAUSED != 'true' || (github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true)) &&
      (github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(main): release '))
    uses: 0xPlayerOne/code-foundry/.github/workflows/release.yml@v1.39.3
    with:
      billing-pause-bypass: ${{ github.event_name == 'workflow_dispatch' && inputs['release-while-paused'] == true }}
      runner: ubuntu-latest
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v1.39.3
      git-workflow: direct
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      # Required by the reusable legacy workflow's declared npm job, which is disabled here.
      id-token: write
    secrets:
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
