name: TanStack Start Preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
      - 'compose.yml'
      - 'infra/postgres/**'
      - '.github/workflows/tanstack-start-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: start-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@adea-ai/web^...
      - run: bun run --cwd apps/web start:verify
      - run: bun run build:cloudflare
      - run: bunx playwright install --with-deps chromium
      - name: Isolated Workers and browser parity
        run: bun run --cwd apps/web start:test:local
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tanstack-start-preview
          path: |
            apps/web/start-preview/test-results/
            apps/web/start-preview/playwright-report/
            apps/web/start-preview/.checks/client-modules.json
            apps/web/start-preview/.checks/local-*/result.json
            apps/web/start-preview/.checks/local-*/worker-*.log
          include-hidden-files: true
          retention-days: 14
