name: TanStack Start Host
on:
  pull_request:
    branches: [main]
    # `opened` and `reopened` matter for pull requests that are never draft
    # (the release automation's), which never emit `ready_for_review`. The
    # draft guard below keeps a draft from allocating a runner or reporting.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: start-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# The host lane always triggers on a pull request and ends in `Host gate`, a
# required check. A workflow-level path filter never reports on a pull request
# that touches none of its paths, which a required check cannot tolerate, so
# scripts/ci-lane-selection.mjs decides applicability inside the run instead.
jobs:
  changes:
    name: Host changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.select.outputs.applicable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select whether the host lane applies
        id: select
        run: node scripts/ci-lane-selection.mjs host

  verify:
    needs: changes
    if: needs.changes.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # Resolve Playwright from the frozen workspace before downloading its
      # browsers. Running bunx first fetches a different release and revision.
      # The browser download (network + apt) never touches the workspace the
      # builds write to, so it runs concurrently with the builds
      # instead of serializing in front of the browser suite. Failure still
      # surfaces at the wait below, before the suite starts.
      - name: Install Playwright Chromium in the background
        id: playwright-install
        run: bunx playwright install --with-deps chromium
        background: true
      - run: bunx turbo run build --filter=@adea-ai/web^...
      - run: bun run --cwd apps/web start:verify
      - run: bun run build:cloudflare
      # Route surface and asset-caching gate against the production build
      # (`start:check-routes` boots the built Worker on its own).
      - name: Route surface check
        run: bun run --cwd apps/web start:check-routes
      - name: Wait for the Playwright install
        wait: [playwright-install]
      - name: Isolated Worker and browser suite
        run: bun run --cwd apps/web start:test:local
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tanstack-start-host
          path: |
            apps/web/start/test-results/
            apps/web/start/playwright-report/
            apps/web/dist/.checks/client-modules.json
            apps/web/start/.checks/local-*/result.json
            apps/web/start/.checks/local-*/worker-*.log
          include-hidden-files: true
          retention-days: 14

  # The required check: a pass when the change touches none of the host lane's
  # inputs or the lane passed, a failure when the lane failed or was cancelled.
  # While the lane runs the gate has not reported, so the merge stays blocked.
  gate:
    name: Host gate
    needs: [changes, verify]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate the host result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.applicable }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT applicable=$APPLICABLE verify=$VERIFY_RESULT"
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "::error::Change detection did not succeed, so the host result is unknown."
            exit 1
          fi
          if [ "$APPLICABLE" != 'true' ]; then
            echo "PASS: the change touches none of the host lane's inputs."
            exit 0
          fi
          if [ "$VERIFY_RESULT" != 'success' ]; then
            echo "::error::The host lane did not pass ($VERIFY_RESULT)."
            exit 1
          fi
          echo "PASS: the host lane passed."
