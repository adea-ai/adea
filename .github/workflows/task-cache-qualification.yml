name: Task cache qualification

# Production builds only; no private asset fetch, service calls or deployment.
# Default-branch runs seed the cache; pull requests may only read it.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/orch-*'
      - 'scripts/vite-plus-proof*'
      - '.github/workflows/task-cache-qualification.yml'
  pull_request:
    types: [ready_for_review, synchronize]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/orch-*'
      - 'scripts/vite-plus-proof*'
      - '.github/workflows/task-cache-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-cache-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-build:
    if: vars.CI_BILLING_PAUSED != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore production task cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: production-tasks-v2-${{ runner.os }}-${{ runner.arch }}-node24.21.0-bun1.4.3-vp1.3.0-${{ hashFiles('bun.lock', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-tasks-v2-${{ runner.os }}-${{ runner.arch }}-node24.21.0-bun1.4.3-vp1.3.0-${{ hashFiles('bun.lock', 'vite.config.ts') }}-
      - name: Qualify real build replay
        env:
          RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          proof=node_modules/.vite/task-cache/qualification-head
          head="$(git rev-parse HEAD)"
          previous="$(cat "$proof" 2>/dev/null || true)"
          # The cacheable task count comes from the build graph itself. A literal
          # would keep asserting a number the graph no longer has.
          expected="$(node scripts/vite-plus-proof.mjs --print-expectation)"
          echo "expected cache summary: $expected"
          # Only the outputs the build graph declares are owned by this lane, and
          # only those are ever removed.
          mkdir -p "$RUNNER_TEMP/cold-cache"
          # 1. The cold baseline: an empty cache directory, so the build cannot
          #    restore anything. It is the reference the restored outputs are
          #    compared against, and it is independent of the restored cache.
          node scripts/vite-plus-proof.mjs --clear-outputs
          start=$SECONDS
          VITE_CACHE_PATH="$RUNNER_TEMP/cold-cache" bun run build > "$RUNNER_TEMP/build-cold.log" 2>&1
          cat "$RUNNER_TEMP/build-cold.log"
          node scripts/vite-plus-proof.mjs --check-pass cold --log "$RUNNER_TEMP/build-cold.log"
          node scripts/vite-plus-proof.mjs --print-manifest > "$RUNNER_TEMP/manifest-cold.txt"
          echo "cold elapsed: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
          # 2. The restored pass: the owned outputs are removed again, so what it
          #    measures is what the cache restored and not what the cold pass left
          #    behind.
          node scripts/vite-plus-proof.mjs --clear-outputs
          start=$SECONDS
          bun run build > "$RUNNER_TEMP/build-restored.log" 2>&1
          cat "$RUNNER_TEMP/build-restored.log"
          node scripts/vite-plus-proof.mjs --print-manifest > "$RUNNER_TEMP/manifest-restored.txt"
          echo "restored elapsed: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
          # The restored outputs are byte-identical to the cold baseline.
          node scripts/vite-plus-proof.mjs --compare-manifest "$RUNNER_TEMP/manifest-cold.txt,$RUNNER_TEMP/manifest-restored.txt"
          echo 'The restored build outputs are byte-identical to the cold baseline.' >> "$GITHUB_STEP_SUMMARY"
          if test "$previous" = "$head"; then
            # A complete restore for the same head: the restored pass hit every task too.
            node scripts/vite-plus-proof.mjs --check-pass warm --log "$RUNNER_TEMP/build-restored.log"
            echo 'Fresh runner restored all production tasks for the same head.' >> "$GITHUB_STEP_SUMMARY"
          else
            # An incomplete or stale restore: the restored pass rebuilt what the
            # restore did not cover, and the outputs are still the same bytes.
            node scripts/vite-plus-proof.mjs --check-pass observed --log "$RUNNER_TEMP/build-restored.log"
            echo 'The restore did not cover this head; the restored pass rebuilt from source.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # 3. The warm pass: the cache the restored pass wrote.
          start=$SECONDS
          bun run build > "$RUNNER_TEMP/build-warm.log" 2>&1
          cat "$RUNNER_TEMP/build-warm.log"
          node scripts/vite-plus-proof.mjs --check-pass warm --log "$RUNNER_TEMP/build-warm.log"
          node scripts/vite-plus-proof.mjs --print-manifest > "$RUNNER_TEMP/manifest-warm.txt"
          node scripts/vite-plus-proof.mjs --compare-manifest "$RUNNER_TEMP/manifest-cold.txt,$RUNNER_TEMP/manifest-warm.txt"
          echo "warm elapsed: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
          echo "Restored entry: ${RESTORED_KEY:-none}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$head" > "$proof"
      - name: Save production task cache
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
