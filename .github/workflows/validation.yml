name: Code Foundry

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

# Default every caller job to no repository permissions. Individual jobs grant
# only the scopes their own validation path consumes.
permissions: {}

# Superseded PR updates cancel the previous run; schedule and dispatch runs
# are keyed by event so periodic audits and manual runs stay independent.
concurrency:
  group: code-foundry-validation-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mode:
    name: Mode
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: 0xPlayerOne/code-foundry
          ref: v0.37.4
          path: .github/.code-foundry
          sparse-checkout: |
            src/lib
            src/runtime.mjs
      - name: Install runtime
        run: mv .github/.code-foundry "$RUNNER_TEMP/code-foundry"
      - name: Classify validation mode
        id: classify
        env:
          FOUNDRY_EVENT_NAME: ${{ github.event_name }}
          FOUNDRY_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FOUNDRY_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node "$RUNNER_TEMP/code-foundry/src/runtime.mjs" validation mode >> "$GITHUB_OUTPUT"

  # The stable aggregate check name is the caller job name plus the
  # orchestrator gate job name: "Validation / Gate". Keep both names fixed.
  validation:
    name: Validation
    needs: mode
    if: vars.CI_BILLING_PAUSED != 'true'
    # Reusable workflows can only maintain or reduce the caller job's scopes.
    # The audit tier needs security-events: write for CodeQL uploads.
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: 0xPlayerOne/code-foundry/.github/workflows/validation.yml@v0.37.4
    with:
      mode: ${{ needs.mode.outputs.mode }}
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v0.37.4
      ci-runner: ubuntu-latest
      test-runner: ubuntu-latest
      unit-runner: ubuntu-latest
      security-runner: ubuntu-latest
      codeql-runner: ubuntu-latest
      rust-shards: '["all"]'
      rust-threads: "2"
      rust-max-parallel: 3
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  apply_label_metadata_once:
    name: Apply label metadata once
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.ref == 'chore/remove-label-metadata-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Update repository labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS='|' read -r name color description; do
            [[ -z "$name" ]] && continue
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/${name}" \
              -f new_name="$name" \
              -f color="$color" \
              -f description="$description" >/dev/null
            printf 'updated %s\n' "$name"
          done <<'LABELS'
          type:feature|0E8A16|Product or platform behavior implemented as a feature.
          type:test|5319E7|Tests, fixtures, conformance suites, or acceptance validation.
          type:infrastructure|0052CC|Infrastructure, deployment, database provisioning, CI, or operational foundations.
          type:documentation|0075CA|Documentation-only work with no runtime behavior change.
          area:frontend|C5DEF5|Web, desktop, mobile, UI, or client-state work.
          area:backend|BFDADC|Application services, APIs, workers, or server-side behavior.
          area:data|D4C5F9|Persistence, schemas, migrations, repositories, or durable state.
          area:runtime|F9D0C4|Runtime fabric, Runtime Gateway, RuntimeDrivers, adapters, or harness integration.
          area:security|B60205|Authentication, authorization, trust, credentials, secrets, or isolation.
          area:realtime|FBCA04|Events, SSE, replay, ordering, reconnect, or live synchronization.
          area:spatial|A2EEEF|Three.js scene runtime, spatial presentation, assets, or scene lifecycle.
          area:observability|7057FF|Telemetry, diagnostics, evaluation, performance, or operational evidence.
          area:integration|1D76DB|Cross-service contracts, SDKs, external systems, or repository integration.
          cross-repo|D93F0B|Requires coordinated changes or acceptance evidence across Agent HQ and Control Plane.
          worktree-safe|C2E0C6|Can proceed in an isolated worktree once declared dependencies are satisfied.
          blocked|D73A4A|Cannot proceed because of an unresolved dependency, decision, or external constraint.
          LABELS
