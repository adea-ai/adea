name: Workspace visual lane

# Pixel regression gates for apps/web/e2e/conventional-workspace.spec.ts and
# apps/web/e2e/chat-view-visual.spec.ts.
#
# The two pixel suites sample by pull-request parity (#956): a PR runs one of
# the two, consecutive PRs alternate, and a dispatch refresh runs both.
#
# The committed `-linux` baselines were rendered by the pinned Playwright
# container's own Chromium build, so the lane runs inside that same image: a
# floating runner image would silently change fonts, compositing, or the
# browser revision and make the pixel comparison nondeterministic. The
# workstation lane keeps the `-darwin` baselines; both sets must be refreshed
# together when a UI change moves pixels.
#
# Subtle fills are below the comparator's sensitivity on purpose:
# `toHaveScreenshot` compares in YIQ with a default threshold of 0.2, and the
# two-toned overlay bands (packages/ui/src/styles/theme.css, --muted against
# the panel surface) differ by roughly 0.05, so banded and flat renders both
# "pass". Two guards cover what the pixels cannot: the computed-style e2e in
# conventional-workspace.spec.ts asserts the band paint directly, and the
# warm-up step below refuses to continue until the served stylesheet actually
# contains the band rule. The guard exists because the 2026-10-06 refresh
# dispatch for #1082 caught the documented cold-server assembly transient: the
# render predated the route CSS assembly, its stylesheet lacked the band rules,
# and flat renders were baked into the `-linux` baselines (PRs #1088/#1089
# then churned them back). If the warm-up guard fails, re-dispatch the lane on
# a fresh run instead of refreshing baselines from a partial render; never
# hand-edit expectations.
#
# Both specs mock every workspace API response in the browser and were
# verified to pass with an unreachable database, so this lane needs no
# Postgres service (the desktop/mobile host suite in `tanstack-start.yml`
# keeps the database-backed lane).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/visual-lane.yml'
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate the -linux baselines in the pinned container and upload them.
        required: false
        type: boolean
        default: false

permissions: {}

# The container's default shell is `sh`; the lane's guards use bash.
defaults:
  run:
    shell: bash

concurrency:
  group: visual-lane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual workspace
    # A draft pull request cannot merge, so it allocates no runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The spec mocks every API response and never opens a database
      # connection; these values only keep the app's configuration explicit.
      DATABASE_URL: postgresql://visual-lane:visual-lane@127.0.0.1:1/visual_lane?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://visual-lane:visual-lane@127.0.0.1:1/visual_lane?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://visual-lane:visual-lane@127.0.0.1:1/visual_lane?sslmode=disable
      # The lane runs against the warmed server started below instead of
      # letting Playwright boot a cold one, so the first test never races the
      # dev-server transport (see the warm-up step).
      PERF_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Playwright image ships Node and the browsers but no unzip, which
      # setup-bun needs to extract the Bun archive.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      - run: bun install --frozen-lockfile

      # The image tag and the dependency move together: the image ships the
      # browser revision the Playwright CLI resolves. A mismatch would make the
      # lane test a different Chromium than the one the baselines were made
      # with, so fail loudly and tell the maintainer what to update.
      - name: Pin check
        run: |
          set -euo pipefail
          installed="$(node -p "require('@playwright/test/package.json').version")"
          image='mcr.microsoft.com/playwright:v1.63.0-noble'
          pinned="${image#*:v}"
          pinned="${pinned%-noble}"
          if [[ "$installed" != "$pinned" ]]; then
            echo "::error::@playwright/test ${installed} does not match the lane image ${image}. Bump the image tag and regenerate the -linux baselines with the dependency bump."
            exit 1
          fi

      # The workspace packages ship `dist` (their exports point at it) and the
      # dev server reads it, so the client is prepared before Playwright starts.
      - name: Build workspace dependencies
        run: bunx turbo run build --filter=@adea-ai/web^...

      # Cold dev servers abort most module requests on the first load while
      # Vite finishes dependency optimization (the documented dev-server
      # transport flake: ~1,000 aborted requests, the page stuck at "Opening
      # workspace…"). The server is started once, warmed with a real browser
      # load, and then reused through PERF_BASE_URL, so the lane never races
      # the cold start. Assertions and retries are untouched.
      - name: Start and warm the dev server
        run: |
          set -euo pipefail
          (cd apps/web && exec bun run dev) >/tmp/visual-lane-dev.log 2>&1 &
          for _ in $(seq 1 120); do
            if node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            sleep 1
          done
          if ! node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
            echo "::error::the dev server did not answer on 127.0.0.1:3000"
            cat /tmp/visual-lane-dev.log
            exit 1
          fi
          node - <<'NODE'
          const { chromium } = require('@playwright/test')
          ;(async () => {
            const browser = await chromium.launch()
            const page = await browser.newPage()
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                // Warm the heaviest spec graph (scene work + chat) so no
                // spec's first paint races a dependency re-optimization.
                await page.goto('http://127.0.0.1:3000/?view=chat&scene=work', {
                  waitUntil: 'domcontentloaded',
                  timeout: 60_000,
                })
                // Let Vite finish optimizing and serving the module graph; the
                // loading state may never settle without API mocks, so this
                // warm-up only waits, it never asserts.
                await page.waitForTimeout(15_000)
                console.log(`dev server module graph warm after attempt ${attempt}`)
                break
              } catch (error) {
                console.log(`warm-up attempt ${attempt}: ${error.message}`)
                await page.waitForTimeout(2_000)
              }
            }
            // The appearance popover lazily imports the theme adapters, and
            // that first import discovers dev-server dependencies the base
            // graph never touches. The re-optimization reloads the page and
            // aborts in-flight module loads (the same cold-server flake this
            // warm-up exists for, one chunk deeper), so warm the popover here:
            // after this, every spec's first click opens it without a reload.
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await page.click('[aria-label="Appearance settings"]', { timeout: 5_000 })
                await page.waitForSelector('[role="dialog"]', { timeout: 15_000 })
                console.log(`appearance chunk warm after attempt ${attempt}`)
                break
              } catch (error) {
                console.log(`appearance warm attempt ${attempt}: ${error.message}`)
                await page.waitForTimeout(3_000)
              }
            }
            // The route stylesheet is assembled from the module graph while the
            // server is still re-optimizing, and a page captured mid-assembly
            // can hold a stylesheet that predates the graph's tail imports —
            // the flat-render transient that poisoned the #1082 refresh
            // dispatch. The overlay band rule lives in that tail, is invisible
            // to the pixel comparator (see the header comment), and is the
            // sentinel: refuse to run any capture until it is actually served.
            let stylesheetComplete = false
            for (let attempt = 1; attempt <= 5 && !stylesheetComplete; attempt += 1) {
              stylesheetComplete = await page.evaluate(() => {
                // CSSOM serializes attribute selectors with double quotes, so
                // compare with the quotes stripped rather than on raw text.
                const normalize = (text) => text.replaceAll(`"`, '').replaceAll(`'`, '')
                const needle = normalize(
                  "[role='dialog'][data-variant] [data-slot='sheet-header']"
                )
                for (const sheet of document.styleSheets) {
                  let rules
                  try {
                    rules = sheet.cssRules
                  } catch {
                    continue
                  }
                  for (const rule of rules) {
                    if (
                      rule instanceof CSSStyleRule &&
                      rule.selectorText &&
                      normalize(rule.selectorText).includes(needle)
                    ) {
                      return true
                    }
                  }
                }
                return false
              })
              if (!stylesheetComplete) {
                console.log(`stylesheet sentinel missing after warm attempt ${attempt}; reloading`)
                await page.reload({ waitUntil: 'domcontentloaded' })
                await page.waitForTimeout(5_000)
              }
            }
            if (!stylesheetComplete) {
              throw new Error(
                'the served stylesheet never contained the overlay band sentinel; ' +
                  'the dev-server CSS assembly did not settle. Re-run this lane on a ' +
                  'fresh container instead of refreshing baselines from this render.'
              )
            }
            console.log('stylesheet sentinel present before captures')
            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Visual regression lane
        # A baseline refresh is the case where this step is *expected* to fail
        # first (that is why the refresh was asked for), so the dispatch mode
        # softens it; the pull_request path keeps failing hard.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs['update-snapshots'] }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Sampled split (#956): the two pixel suites alternate by pull-request
          # parity, so each pass pays roughly half the test wall (~90s) while
          # both suites still gate across consecutive PRs. A regression in the
          # suite a PR skips is caught by the next PR's run of that suite.
          # Dispatches (baseline refreshes) always run both.
          if [[ -z "${PR_NUMBER:-}" || $((PR_NUMBER % 2)) -eq 0 ]]; then
            bun run test:e2e:visual
          fi
          if [[ -z "${PR_NUMBER:-}" || $((PR_NUMBER % 2)) -eq 1 ]]; then
            bun run test:e2e:visual:chat
          fi

      - name: Regenerate -linux baselines
        if: github.event_name == 'workflow_dispatch' && inputs['update-snapshots']
        # Snapshot writes happen per test, so a single functional failure must
        # not abort the step before the upload below runs — the point of a
        # refresh dispatch is the regenerated files, and the lane step above
        # already reports the failures this tolerates.
        run: |
          bunx playwright test --config=playwright.config.ts \
            apps/web/e2e/conventional-workspace.spec.ts \
            apps/web/e2e/chat-view-visual.spec.ts --update-snapshots || true

      - name: Print regenerated baselines (temporary, drop before merge)
        if: github.event_name == 'workflow_dispatch' && inputs['update-snapshots']
        run: |
          for f in apps/web/e2e/conventional-workspace.spec.ts-snapshots/workspace-thread-linux.png apps/web/e2e/conventional-workspace.spec.ts-snapshots/workspace-settings-light-linux.png apps/web/e2e/conventional-workspace.spec.ts-snapshots/workspace-settings-dark-linux.png apps/web/e2e/conventional-workspace.spec.ts-snapshots/workspace-settings-narrow-linux.png; do
            echo "BEGIN64 $f"
            base64 -w 2000 "$f" | sed 's/^/B64 /'
            echo "END64 $f"
          done

      - name: Upload regenerated baselines
        if: github.event_name == 'workflow_dispatch' && inputs['update-snapshots']
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-lane-linux-baselines
          path: |
            apps/web/e2e/conventional-workspace.spec.ts-snapshots/*-linux.png
            apps/web/e2e/chat-view-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-lane-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
