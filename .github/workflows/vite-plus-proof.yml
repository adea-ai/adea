name: Vite+ Cache Proof

# Opt-in, non-required proof lane for the Vite+ task cache (vite.config.ts).
# Turbo stays the required runner for every Code Foundry workflow. This lane
# consumes the Code Foundry setup action at the exact reviewed #765 commit,
# runs on pushes to its own branch, and adds no secrets, remote cache, or
# deployment: the cache is the repository's GitHub Actions cache.
#
# Commit message lines make the run assert the restored cache: `vp-proof-expect:
# cold|warm|one-miss` (the graph must have exactly 12 tasks), `vp-proof-miss:
# <task>` (the lone miss must be that task, e.g. types:test) and
# `vp-proof-manifest: <sha256>` (the dist outputs after restore).

on:
  push:
    branches: [claude/project-thread-bdfpdv]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vite-plus-proof-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  proof:
    name: Vite+ cache proof
    if: vars.CI_BILLING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODE_FOUNDRY_VERSION: 1.48.0
      CODE_FOUNDRY_SHA: 2556bba045a26a6b6b8e9634ae874500785c8e99
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout Code Foundry action dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: 0xPlayerOne/code-foundry
          ref: ${{ env.CODE_FOUNDRY_SHA }}
          path: .github/.code-foundry
          sparse-checkout: |
            .github/actions/cache
            package.json
      - name: Verify the pinned runtime
        run: |
          set -euo pipefail
          actual_sha="$(git -C .github/.code-foundry rev-parse HEAD)"
          actual_version="$(node -p "require('./.github/.code-foundry/package.json').version")"
          echo "Code Foundry runtime: $actual_version at $actual_sha"
          [ "$actual_version" = "$CODE_FOUNDRY_VERSION" ]
          [ "$actual_sha" = "$CODE_FOUNDRY_SHA" ]
      - name: Install the pinned cache helper
        run: |
          set -euo pipefail
          mkdir -p .github/actions
          test ! -e .github/actions/cache
          cp -R .github/.code-foundry/.github/actions/cache .github/actions/cache
      # Opt this job's workspace into Vite+. The repository's committed
      # code-foundry.yml is untouched, so required workflows keep using Turbo.
      - name: Opt this job into Vite+
        run: |
          printf '\nmonorepo_tool: vite-plus\n' >> .github/code-foundry.yml
      # Set the override before setup so both Vite+ and the post-job save use
      # a cache path under this runner's temporary directory.
      - name: Set runner-local Vite+ cache path
        shell: bash
        run: |
          set -euo pipefail
          cache_path="$RUNNER_TEMP/adea-vite-plus-proof-cache"
          case "$cache_path" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "Vite+ cache path is outside RUNNER_TEMP" >&2; exit 1 ;;
          esac
          printf 'VITE_CACHE_PATH=%s\n' "$cache_path" >> "$GITHUB_ENV"
      - name: Setup with Code Foundry at exact #765 commit
        uses: 0xPlayerOne/code-foundry/.github/actions/setup@2556bba045a26a6b6b8e9634ae874500785c8e99
        with:
          install: 'true'
          cache-build: 'false'
          cache-vite-plus: 'true'
      - name: Read the expected cache pattern
        id: expect
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%B "$COMMIT_SHA")"
          trailer() { printf '%s\n' "$message" | sed -n "s/^$1: *\(.*[^ ]\) *$/\1/p" | head -n1; }
          {
            printf 'expect=%s\n' "$(trailer vp-proof-expect)"
            printf 'miss=%s\n' "$(trailer vp-proof-miss)"
            printf 'manifest=%s\n' "$(trailer vp-proof-manifest)"
          } >> "$GITHUB_OUTPUT"
      # A fresh runner has no generated dist, so a warm run that passes here
      # has replayed the outputs from the restored cache.
      - name: Vite+ proof graph (restored task cache)
        env:
          EXPECT: ${{ steps.expect.outputs.expect }}
          MISS: ${{ steps.expect.outputs.miss }}
          MANIFEST: ${{ steps.expect.outputs.manifest }}
        run: |
          set -euo pipefail
          args=(--fresh)
          [ -z "$EXPECT" ] || args+=(--expect "$EXPECT")
          [ -z "$MISS" ] || args+=(--miss "$MISS")
          [ -z "$MANIFEST" ] || args+=(--expect-manifest "$MANIFEST")
          node scripts/vite-plus-proof.mjs "${args[@]}"
      - name: Vite+ cache correctness (disposable worktree)
        run: node scripts/vite-plus-proof.mjs --self-check
      - name: Wrapper leaves a dirty checkout unchanged
        env:
          ADEA_VP_PROOF: '1'
        run: bun test scripts/vite-plus-proof.test.ts
      - name: Task cache contents
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/adea-vite-plus-proof-cache"
          test "$VITE_CACHE_PATH" = "$expected"
          test "$CODE_FOUNDRY_VITE_CACHE_PATH" = "$expected"
          test -d "$VITE_CACHE_PATH"
          test -n "$(find "$VITE_CACHE_PATH" -type f -print -quit)"
          du -sh "$VITE_CACHE_PATH"
          if [ -d node_modules/.vite/task-cache ]; then
            du -sh node_modules/.vite/task-cache
          fi
