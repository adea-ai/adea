[package]
name = "agent-hq-desktop"
version = "0.8.3"
description = "Thin native desktop shell for Agent HQ"
authors = ["Agent HQ"]
edition = "2021"

[patch.crates-io]
# Tauri's GTK3 Linux stack requires glib 0.18.5; this local crate carries the
# upstream VariantStrIter soundness fix while GTK3 prevents upgrading to glib 0.20.
glib = { path = "../../../vendor/glib-0.18.5" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
keyring = "4.1.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.0", features = [] }
tokio = { version = "1.0", features = ["sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.23.0"
