[package]
name = "agent-hq-desktop"
version = "0.7.1"
description = "Thin native desktop shell for Agent HQ"
authors = ["Agent HQ"]
edition = "2021"

[patch.crates-io]
# Tauri's GTK3 Linux stack requires glib 0.18.5; this local crate carries the
# upstream VariantStrIter soundness fix while GTK3 prevents upgrading to glib 0.20.
glib = { path = "../../../vendor/glib-0.18.5" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
keyring = "4.1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tokio = { version = "1.0", features = ["sync", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
url = "2.5"
