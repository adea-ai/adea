[package]
name = "adea-desktop"
version = "0.18.4"
description = "Thin native desktop shell for Adea"
authors = ["Adea"]
edition = "2021"

[patch.crates-io]
# Tauri's GTK3 Linux stack requires glib 0.18.5; this local crate carries the
# upstream VariantStrIter soundness fix while GTK3 prevents upgrading to glib 0.20.
glib = { path = "../../../vendor/glib-0.18.5" }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
hex = "0.4"
keyring = "4.1.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tauri = { version = "2.0", features = [] }
tokio = { version = "1.0", features = ["sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
url = "2.5"

# The boot pipeline's recovery dialog is the only native dialog the shell
# shows; rfd is already the toolkit behind Tauri's dialog plugin, used directly
# so a failed launch needs no plugin registration. Linux keeps the GTK3 backend
# the rest of the shell links against instead of the default portal stack.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-foundation = "0.3.2"
objc2-speech = "0.3.2"

[dev-dependencies]
tempfile = "3.23.0"
toml = "0.8"
