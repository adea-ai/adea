<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shell-bench ipc probe</title>
  </head>
  <body>
    <script>
      // IPC round-trip probe. Autodetects the shell bridge, runs 200 sequential
      // pings, posts raw samples to the bench server. Bridges:
      //   Electron: window.benchPing (contextBridge -> ipcRenderer.invoke('ping'))
      //   Tauri:    window.__TAURI__.core.invoke('ping')
      function detectBridge() {
        if (typeof window.benchPing === 'function') return 'electron-ipc'
        if (
          window.__TAURI &&
          window.__TAURI.core &&
          typeof window.__TAURI.core.invoke === 'function'
        )
          return 'tauri-invoke'
        return null
      }
      function ping(bridge) {
        if (bridge === 'electron-ipc') return window.benchPing()
        return window.__TAURI.core.invoke('ping')
      }
      async function run() {
        var bridge = detectBridge()
        var payload = { bridge: bridge, url: location.href }
        if (bridge) {
          await ping(bridge) // warm the channel once
          var samples = []
          for (var i = 0; i < 200; i++) {
            var t0 = performance.now()
            await ping(bridge)
            samples.push(Math.round((performance.now() - t0) * 1000)) // microseconds
          }
          payload.samplesUs = samples
        }
        try {
          await fetch('/__bench/ipc', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true,
          })
        } catch (e) {
          /* bench-only */
        }
      }
      var attempts = 0
      var timer = setInterval(function () {
        attempts++
        if (detectBridge() || attempts > 100) {
          clearInterval(timer)
          if (!detectBridge()) {
            payload.noBridgeDiagnostics = {
              tauriType: typeof window.__TAURI,
              benchPingType: typeof window.benchPing,
              windowKeys: Object.keys(window)
                .filter(function (k) {
                  return /tauri|bench|ipc/i.test(k)
                })
                .join(','),
              href: location.href,
            }
          }
          run()
        }
      }, 100)
    </script>
  </body>
</html>
