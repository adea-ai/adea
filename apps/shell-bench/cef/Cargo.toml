[package]
name = "shell-bench-cef"
version = "0.1.0"
edition = "2024"
publish = false
description = "M5.2 throwaway parity shell - deleted by #371"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "shell-bench-cef"
path = "src/main.rs"

[[bin]]
name = "shell-bench-cef-helper"
path = "src/bin/cefsimple_helper.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[package.metadata.cef.bundle]
helper_name = "shell-bench-cef-helper"
resources_path = "resources"

[dependencies]
cef = { version = "152.2.0", features = ["build-util", "sandbox"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSEvent",
  "NSResponder",
  "NSUserInterfaceValidation",
  "NSView",
  "NSWindow",
] }
objc2-foundation = "0.3.2"

[profile.release]
strip = true
