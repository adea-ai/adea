<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>shell-bench-nwjs</title>
    <script src="url.js"></script>
  </head>
  <body>
    <script>
      // NW.js launcher: the runner writes url.js with window.__BENCH_URL before
      // each launch, so no CLI-argv plumbing is needed.
      if (window.__BENCH_URL) location.replace(window.__BENCH_URL)
      else document.body.textContent = 'no bench url'
    </script>
  </body>
</html>
